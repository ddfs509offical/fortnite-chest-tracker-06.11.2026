name: Build exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fortnite-chest-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyside6 pyinstaller

      - run: pyinstaller --noconsole --onefile --name "Fortnite Chest Tracker" --icon app.ico --add-data "hud.html;." --collect-submodules chest_tracker --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick run.py

      - uses: actions/upload-artifact@v4
        with:
          name: Fortnite-Chest-Tracker
          path: fortnite-chest-tracker/dist/*.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: fortnite-chest-tracker/dist/*.exe
